apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: openstackblockstorages.openstack.example.com
spec:
  group: openstack.example.com
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                projectName:
                  type: string
            status:
              type: object
              properties:
                volumes:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      sizeGB:
                        type: integer
                      status:
                        type: string
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: openstackblockstorages
    singular: openstackblockstorage
    kind: OpenStackBlockStorage
    shortNames:
    - osbs
